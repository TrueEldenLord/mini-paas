services:
  traefik:
    image: traefik:v3.0
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./traefik.yml:/traefik.yml:ro
      - ./routes.yml:/routes.yml:ro
    networks:
      - web

  sample-app:
    build:
      context: ../sample-app
    networks:
      - web

networks:
  web:
